[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-resilience-model"
version = "2.0.0"
description = "Minimal stochastic resilience-stress model of dopaminergic neuron vulnerability"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "A. V. Gavrilova"},
  {name = "S. Liashenko"},
  {name = "C. Galli"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10"
]

[project.optional-dependencies]
numba = ["numba>=0.58"]

[tool.setuptools.packages.find]
where = ["src"]
